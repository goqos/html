<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <meta name="theme-color" content="#2A5C5E"/> 
    <link href='https://i.ibb.co/MDhNgWjq/20260612-033900.jpg' rel='icon' type='image/x-icon'/> 
    <link href='https://i.ibb.co/MDhNgWjq/20260612-033900.jpg' rel='shortcut icon' type='image/x-icon'/> 
    <title>HTML Viewer & Editor Tool</title>
    <script> 
        if (window.location.search.includes('i=')) { 
            var cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname; 
            window.history.replaceState({path: cleanUrl}, '', cleanUrl); 
        } 
    </script> 
    <style> 
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; margin: 0; padding: 0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } 
        html, body { border-top:0.1px solid #1B4446; height: 100%; background-color: #1e1e1e; color: #333; display: flex; flex-direction: column; overflow: hidden; } 
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; } 
        
        /* Header & Toolbar Styling */ 
        header { background-color: #1A3E40; color: white; padding: 15px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; } 
        h1 { font-size: 1.2rem; } 
        .button-group { display: flex; gap: 9px; } 
        button { background:#1B4446; width: 40px; height: 40px; border: none; border-radius: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease, transform 0.1s ease, opacity 0.3s ease, visibility 0.3s ease; box-shadow:0px 6px 22px rgba(0,0,0,0.2) } 
        button:active { transform: scale(0.95); } 
        button svg { width: 20px; height: 20px; fill: #efefef; } 
        
        /* Workspace Layout */ 
        .workspace { display: flex; flex: 1; height: calc(100% - 60px); position: relative; overflow: hidden; } 
        .panel { background-color:#081616; flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; } 
        .panel::before { content: "HTML\00000aEDIT"; position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; font-weight: bold; color:#1B4446; font-family: sans-serif; pointer-events: none; z-index: 1; opacity: 0; transition: opacity 0.2s ease;} 
        textarea:placeholder-shown + .panel::before,.panel:has(textarea:placeholder-shown)::before { opacity: 0.5;} 
        textarea:focus + .panel::before,.panel:has(textarea:focus)::before { opacity: 0;} 
        textarea { height: 100%; width: 100%; flex: 1; letter-spacing:1px; font-weight:100; line-height: 1.5; border: none; padding: 25px; font-family: 'Courier New', Courier, monospace; font-size: 1rem; resize: none; outline: none; color: #d4d4d4; background: transparent; z-index: 2; position: relative; } 
        
        /* Floating Buttons Container & Style */ 
        .floating-actions { position: absolute; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 12px; z-index: 15; }
        .btn-floating { width: 56px; height: 56px; background: #1B4446; box-shadow: 0px 8px 24px rgba(0,0,0,0.4); border-radius: 100%; display: flex; align-items: center; justify-content: center; } 
        .btn-floating svg { width: 26px; height: 26px; fill: #efefef; }
        .floating-actions.hidden { opacity: 0; visibility: hidden; pointer-events: none; } 
        
        /* Full Screen Hidden Sidebar Page */ 
        .sidebar { position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background-color: #081616; z-index: 20; display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); } 
        .sidebar.open { transform: translateX(-100%); }
        .sidebar-header { background-color: transparent; padding: 15px 20px; font-weight: bold; font-size: 1.1rem; color: #efefef; border-bottom: 1px solid #2d2d2d; display: flex; justify-content: space-between; align-items: center; } 
        .btn-close-sidebar { background: #1B4446; border-radius: 50%; width: 36px; height: 36px; }
        .file-list { scrollbar-width: none; -ms-overflow-style: none; flex: 1; overflow-y: auto; padding:20px; display: flex; flex-direction: column; gap: 12px; } 
        .file-item { margin:0px 5px; background-color: #10292A; border-radius: 10px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease; } 
        .file-info { display: flex; flex-direction: column; overflow: hidden; flex-grow: 1; padding-right: 15px; } 
        .file-name { color: #e0e0e0; font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } 
        .file-date { color: #777; font-size: 0.8rem; margin-top: 4px; } 
        .btn-delete-file { background: transparent; width: 34px; height: 34px; border-radius: 6px; box-shadow: none; flex-shrink: 0; } 
        .btn-delete-file svg { width: 16px; height: 16px; } 
        .no-files { color: #666; text-align: center; font-size: 1rem; margin-top: 40px; font-style: italic; } 
        #fileLoader { display: none; }
        
        /* --- CUSTOM MODAL STYLES --- */ 
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; } 
        .modal-overlay.active { opacity: 1; visibility: visible; } 
        .modal-container { background-color: #10292A; width: 90%; max-width: 400px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid #1B4446; transform: scale(0.9); transition: transform 0.3s ease; } 
        .modal-overlay.active .modal-container { transform: scale(1); } 
        .modal-title { color: #efefef; font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; } 
        .modal-input { width: 100%; background: #081616; border: 1px solid #1B4446; border-radius: 6px; padding: 12px; color: #efefef; font-size: 1rem; outline: none; margin-bottom: 20px; font-family: inherit; } 
        .modal-input:focus { border-color: #2ecc71; } 
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; } 
        .btn-modal { width: auto; height: auto; border-radius: 6px; padding: 10px 20px; font-size: 0.95rem; font-weight: 600; color: white; box-shadow: none; } 
        .btn-modal-cancel { background: transparent; color: #aaa; } 
        .btn-modal-cancel:hover { color: #fff; } 
        .btn-modal-submit { background: #1B4446; } 
        .btn-modal-submit:hover { background: #23595c; } 
        
        /* Search Status Info */
        .search-status { color: #aaa; font-size: 0.85rem; margin-top: -10px; margin-bottom: 15px; display: block; }
    </style>
</head>
<body> 
    <header> 
        <h1>HTML</h1> 
        <div class="button-group"> 
            <input type="file" id="fileLoader" accept=".html,.txt" /> 
            <button id="openBtn" title="Open Local HTML/TXT File"> 
                <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg> 
            </button> 
            <button class="btn-save" id="saveBtn" title="Save Code to Storage List"> 
                <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.1 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg> 
            </button> 
            <button class="btn-copy" id="copyBtn" title="Copy Code"> 
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> 
            </button> 
            <button class="btn-paste" id="pasteBtn" title="Paste Code"> 
                <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg> 
            </button> 
            <button class="btn-download" id="downloadBtn" title="Download HTML"> 
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg> 
            </button> 
            <button class="btn-clear" id="clearBtn" title="Clear Code"> 
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> 
            </button> 
        </div> 
    </header> 
    
    <div class="workspace" id="workspace"> 
        <div class="panel"> 
            <textarea id="htmlInput" placeholder=""></textarea> </div> 
            
            <!-- Floating Buttons Group -->
            <div class="floating-actions" id="floatingGroup">
                <!-- Search Floating Button -->
                <button class="btn-floating" id="searchBtn" title="Search Code">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
                <!-- Run Floating Button -->
                <button class="btn-floating" id="runBtn" title="Run in New Tab"> 
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 
                </button> 
            </div>
            
            <div class="sidebar" id="sidebarPage"> 
                <div class="sidebar-header"> 
                    <span style='font-size:16px; opacity:0.1;'></span> 
                    <button class="btn-close-sidebar" id="closeSidebarBtn" title="Go Back"> 
                        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> 
                    </button> 
                </div> 
                <div class="file-list" id="fileListContainer"></div> 
            </div> 
    </div> 
    
    <!-- Save File Modal -->
    <div class="modal-overlay" id="customModal"> 
        <div class="modal-container"> 
            <div class="modal-title">Apni file ka naam enter karein:</div> 
            <input type="text" class="modal-input" id="modalFileName" value="Untitled_Code.html" placeholder="File name..."> 
            <div class="modal-actions"> 
                <button class="btn-modal btn-modal-cancel" id="modalCancelBtn">Cancel</button> 
                <button class="btn-modal btn-modal-submit" id="modalSubmitBtn">Save</button> 
            </div> 
        </div> 
    </div>

    <!-- New Search Tool Modal -->
    <div class="modal-overlay" id="searchModal"> 
        <div class="modal-container"> 
            <div class="modal-title">Finder Syntax coding:</div> 
            <input type="text" class="modal-input" id="modalSearchInput" placeholder="typing.."> 
            <span class="search-status" id="searchStatus"></span>
            <div class="modal-actions"> 
                <button class="btn-modal btn-modal-cancel" id="searchCancelBtn">Cancel</button> 
                <button class="btn-modal btn-modal-submit" id="searchSubmitBtn">Find Next</button> 
            </div> 
        </div> 
    </div>

    <script> 
        const htmlInput = document.getElementById('htmlInput'); 
        const floatingGroup = document.getElementById('floatingGroup');
        const runBtn = document.getElementById('runBtn'); 
        const searchBtn = document.getElementById('searchBtn'); 
        const copyBtn = document.getElementById('copyBtn'); 
        const pasteBtn = document.getElementById('pasteBtn'); 
        const downloadBtn = document.getElementById('downloadBtn'); 
        const clearBtn = document.getElementById('clearBtn'); 
        const saveBtn = document.getElementById('saveBtn'); 
        const openBtn = document.getElementById('openBtn'); 
        const fileLoader = document.getElementById('fileLoader'); 
        const fileListContainer = document.getElementById('fileListContainer'); 
        const sidebarPage = document.getElementById('sidebarPage'); 
        const closeSidebarBtn = document.getElementById('closeSidebarBtn'); 
        const workspace = document.getElementById('workspace');
        
        // Modal Elements 
        const customModal = document.getElementById('customModal'); 
        const modalFileName = document.getElementById('modalFileName'); 
        const modalCancelBtn = document.getElementById('modalCancelBtn'); 
        const modalSubmitBtn = document.getElementById('modalSubmitBtn');
        
        // Search Modal Elements
        const searchModal = document.getElementById('searchModal');
        const modalSearchInput = document.getElementById('modalSearchInput');
        const searchCancelBtn = document.getElementById('searchCancelBtn');
        const searchSubmitBtn = document.getElementById('searchSubmitBtn');
        const searchStatus = document.getElementById('searchStatus');

        const STORAGE_KEY = 'savedHtmlFilesArray';
        let lastSearchPos = 0;
        let lastSearchQuery = "";
        
        window.onload = function() { renderSavedFiles(); };
        
        // --- SWIPE / SCROLL DETECTION LOGIC TO OPEN FULLSCREEN SIDEBAR --- 
        let startX = 0; let startY = 0;
        workspace.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
        workspace.addEventListener('touchend', (e) => { 
            let endX = e.changedTouches[0].clientX; 
            let endY = e.changedTouches[0].clientY; 
            if (startX - endX > 80 && Math.abs(startY - endY) < 50) { openSidebar(); } 
        }, { passive: true });
        workspace.addEventListener('wheel', (e) => { if (e.deltaX > 40) { openSidebar(); } }, { passive: true });
        
        function openSidebar() { sidebarPage.classList.add('open'); floatingGroup.classList.add('hidden'); }
        function closeSidebar() { sidebarPage.classList.remove('open'); floatingGroup.classList.remove('hidden'); }
        closeSidebarBtn.addEventListener('click', closeSidebar);
        
        // --- RENDER SIDEBAR STORAGE DATA --- 
        function renderSavedFiles() { 
            fileListContainer.innerHTML = ''; 
            const savedFiles = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            if (savedFiles.length === 0) { fileListContainer.innerHTML = '<div class="no-files"></div>'; return; }
            savedFiles.forEach((file, index) => { 
                const fileItem = document.createElement('div'); 
                fileItem.className = 'file-item'; 
                fileItem.addEventListener('click', (e) => { 
                    if(e.target.closest('.btn-delete-file')) return; 
                    htmlInput.value = file.code; 
                    closeSidebar(); 
                });
                const fileInfo = document.createElement('div'); 
                fileInfo.className = 'file-info'; 
                const fileName = document.createElement('span'); 
                fileName.className = 'file-name'; 
                fileName.textContent = file.name;
                const fileDate = document.createElement('span'); 
                fileDate.className = 'file-date'; 
                fileDate.textContent = file.date;
                fileInfo.appendChild(fileName); 
                fileInfo.appendChild(fileDate);
                const deleteBtn = document.createElement('button'); 
                deleteBtn.className = 'btn-delete-file'; 
                deleteBtn.title = 'Delete File'; 
                deleteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'; 
                deleteBtn.addEventListener('click', () => { deleteFileFromList(index); });
                fileItem.appendChild(fileInfo); 
                fileItem.appendChild(deleteBtn); 
                fileListContainer.appendChild(fileItem); 
            }); 
        }
        
        function deleteFileFromList(index) { 
            let savedFiles = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; 
            savedFiles.splice(index, 1); 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedFiles)); 
            renderSavedFiles(); 
        }
        
        // --- BUTTONS LOGIC --- 
        openBtn.addEventListener('click', () => { fileLoader.click(); });
        fileLoader.addEventListener('change', (event) => { 
            const file = event.target.files[0]; 
            if (!file) return;
            const reader = new FileReader(); 
            reader.onload = function(e) { htmlInput.value = e.target.result; }; 
            reader.readAsText(file); 
            event.target.value = ''; 
        });
        
        // --- CUSTOM MODAL SAVE LOGIC --- 
        saveBtn.addEventListener('click', () => { 
            const code = htmlInput.value; 
            if (!code.trim()) return; 
            modalFileName.value = "Untitled_Code.html"; 
            customModal.classList.add('active'); 
            modalFileName.focus(); 
        });
        
        modalCancelBtn.addEventListener('click', () => { customModal.classList.remove('active'); });
        modalSubmitBtn.addEventListener('click', () => { 
            const code = htmlInput.value; 
            let fileName = modalFileName.value; 
            let checkedName = fileName.trim() ? fileName.trim() : "Untitled_Code.html"; 
            if (!checkedName.toLowerCase().endsWith('.html') && !checkedName.toLowerCase().endsWith('.txt')) { checkedName += '.html'; } 
            const timestamp = new Date().toLocaleString();
            try { 
                let savedFiles = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; 
                savedFiles.unshift({ name: checkedName, code: code, date: timestamp });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(savedFiles)); 
                renderSavedFiles(); 
                customModal.classList.remove('active');
                const originalSVG = saveBtn.innerHTML; 
                saveBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>'; 
                saveBtn.style.backgroundColor = "#2ecc71"; 
                setTimeout(() => { saveBtn.innerHTML = originalSVG; saveBtn.style.backgroundColor = ""; }, 1500); 
            } catch (e) {} 
        });
        
        customModal.addEventListener('click', (e) => { if (e.target === customModal) { customModal.classList.remove('active'); } });
        
        // --- SEARCH ENGINE LOGIC ---
        searchBtn.addEventListener('click', () => {
            searchStatus.textContent = "";
            searchModal.classList.add('active');
            modalSearchInput.focus();
        });

        searchCancelBtn.addEventListener('click', () => {
            searchModal.classList.remove('active');
        });

        searchModal.addEventListener('click', (e) => { 
            if (e.target === searchModal) { searchModal.classList.remove('active'); } 
        });

        searchSubmitBtn.addEventListener('click', performSearch);
        modalSearchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { performSearch(); }
        });

        function performSearch() {
            const query = modalSearchInput.value;
            const text = htmlInput.value;
            if (!query) return;

            // Agar naya word search kiya h to pointer reset karo
            if (query !== lastSearchQuery) {
                lastSearchPos = 0;
                lastSearchQuery = query;
            }

            // Case-insensitive search ke liye downcase kar rhe h
            const index = text.toLowerCase().indexOf(query.toLowerCase(), lastSearchPos);

            if (index !== -1) {
                htmlInput.focus();
                // Text highlight/select karne ka native textarea method
                htmlInput.setSelectionRange(index, index + query.length);
                
                // Line calculate karke scroll smoothly auto-position karne ke liye
                const lineHeight = parseFloat(window.getComputedStyle(htmlInput).lineHeight);
                const textBefore = text.substring(0, index);
                const linesBefore = textBefore.split('\n').length;
                htmlInput.scrollTop = (linesBefore * lineHeight) - (htmlInput.clientHeight / 2);
                
                searchStatus.style.color = "#2ecc71";
                searchStatus.textContent = "Found match!";
                
                // Next click par aage khojne ke liye index shift
                lastSearchPos = index + query.length;
            } else {
                // Agar aage koi text nhi mila to dubara shuruat se start karega
                if (lastSearchPos > 0) {
                    lastSearchPos = 0; 
                    performSearch();
                } else {
                    searchStatus.style.color = "#e74c3c";
                    searchStatus.textContent = "No match found.";
                }
            }
        }

        // --- RUN, COPY, PASTE, DOWNLOAD & CLEAR LOGIC ---
        runBtn.addEventListener('click', () => { 
            const code = htmlInput.value; 
            const newTab = window.open('about:blank', '_blank'); 
            if (newTab) { newTab.document.open(); newTab.document.write(code); newTab.document.close(); } 
        });
        
        copyBtn.addEventListener('click', () => { 
            if (!htmlInput.value) return; 
            navigator.clipboard.writeText(htmlInput.value).then(() => { 
                const originalSVG = copyBtn.innerHTML; 
                copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>'; 
                copyBtn.style.backgroundColor = "#2ecc71"; 
                setTimeout(() => { copyBtn.innerHTML = originalSVG; copyBtn.style.backgroundColor = ""; }, 1500); 
            }); 
        });
        
        pasteBtn.addEventListener('click', () => { 
            htmlInput.focus(); 
            navigator.permissions.query({ name: "clipboard-read" }).then((result) => { 
                if (result.state === "granted" || result.state === "prompt") { 
                    navigator.clipboard.readText().then(text => { htmlInput.value = text; }).catch(() => { document.execCommand('paste'); }); 
                } else { document.execCommand('paste'); } 
            }); 
        });
        
        downloadBtn.addEventListener('click', () => { 
            const code = htmlInput.value; 
            const blob = new Blob([code], { type: 'text/html' }); 
            const url = URL.createObjectURL(blob); 
            const downloadLink = document.createElement('a'); 
            downloadLink.href = url; downloadLink.download = 'index.html'; 
            document.body.appendChild(downloadLink); 
            downloadLink.click(); document.body.removeChild(downloadLink); 
            URL.revokeObjectURL(url); 
        });
        
        clearBtn.addEventListener('click', () => { htmlInput.value = ''; }); 
    </script>
</body>
</html>
